# Emblem Cards — runs behind the shared gateway on /emblem/.
#
# Neither service binds a host port. Both attach to the `gateway_emblem`
# network (see deploy/gateway/docker-compose.yml) so the gateway Caddy can
# reach them by container name. Sibling apps live on other networks and
# cannot reach these containers directly.
#
# `IMAGE_TAG` MUST be set (no `:latest` fallback) so a missing .env fails
# loudly instead of silently deploying stale images.
services:
  emblem-server:
    image: ghcr.io/${GH_REPO}/server:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: emblem-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      CLIENT_ORIGIN: "https://${SITE_ADDRESS}"
    networks:
      - gateway
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 384M

  emblem-web:
    image: ghcr.io/${GH_REPO}/client:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: emblem-web
    restart: unless-stopped
    # Order-only. Using `condition: service_healthy` here would couple the
    # web container's lifecycle to backend health: a transient server blip
    # would prevent emblem-web from starting on a compose up, which is a
    # worse UX than "UI loads but socket.io retries".
    depends_on:
      - emblem-server
    networks:
      - gateway
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # Caddy writes runtime state to /config and /data; the built-in Caddyfile
    # and /srv are baked in from the Dockerfile and don't need to be writable.
    read_only: true
    tmpfs:
      - /tmp
      - /config
      - /data
    # Healthcheck inherited from the Dockerfile `HEALTHCHECK` directive.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

networks:
  gateway:
    name: gateway_emblem
    external: true
