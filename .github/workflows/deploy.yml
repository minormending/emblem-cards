name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_repo: ${{ steps.repo.outputs.lc }}
      tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: repo
        run: echo "lc=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.lc }}/server:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.lc }}/server:latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build & push client
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/client/Dockerfile
          push: true
          # Paths must match the gateway's handle_path prefix for /emblem/*.
          # VITE_SERVER_URL is empty so the client uses window.location.origin,
          # which is the user's hostname (TLS-terminated by the gateway).
          build-args: |
            VITE_BASE_PATH=/emblem/
            VITE_SOCKET_PATH=/emblem/socket.io/
            VITE_SERVER_URL=
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.lc }}/client:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.lc }}/client:latest
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

      # Vulnerability scan after build, before deploy. Non-blocking on LOW /
      # MEDIUM findings so a churny CVE database doesn't stall deploys; a
      # HIGH / CRITICAL CVE fails the run and surfaces in the Security tab.
      - name: Scan server image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.repo.outputs.lc }}/server:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: sarif
          output: trivy-server.sarif
      - name: Scan client image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.repo.outputs.lc }}/client:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: sarif
          output: trivy-client.sarif
      - name: Upload trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .
        continue-on-error: true

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            deploy

      # The droplet layout (see deploy/setup-droplet.sh) is:
      #   /opt/apps/_gateway/  — shared Caddy (Caddyfile, compose, landing)
      #   /opt/apps/emblem/    — this app's compose
      # Each app has its own .env. The gateway owns TLS + routing; each app
      # compose only attaches containers to the shared `gateway` network.
      - name: Copy gateway config to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          # Explicit file list — the scp-action treats `source` as literal
          # paths, not a glob. Add new files here when they appear in the
          # landing/ directory.
          source: "deploy/gateway/Caddyfile,deploy/gateway/docker-compose.yml,deploy/gateway/landing/index.html"
          target: "/opt/apps/_gateway"
          strip_components: 2

      - name: Copy emblem compose to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: "deploy/emblem/docker-compose.yml"
          target: "/opt/apps/emblem"
          strip_components: 2

      - name: Pull & restart on droplet
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_REPO: ${{ needs.build-push.outputs.image_repo }}
          IMAGE_TAG: ${{ needs.build-push.outputs.tag }}
          SITE_ADDRESS: ${{ secrets.SITE_ADDRESS }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: GH_REPO,IMAGE_TAG,SITE_ADDRESS,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail

            # Isolate docker credentials in a per-run temp dir so a failure
            # after `docker login` doesn't leave the GHCR PAT in the
            # deploy user's ~/.docker/config.json.
            DOCKER_CONFIG="$(mktemp -d)"
            export DOCKER_CONFIG
            trap 'rm -rf "$DOCKER_CONFIG"' EXIT

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Gateway .env — just the hostname for TLS.
            cat > /opt/apps/_gateway/.env <<EOF
            SITE_ADDRESS=${SITE_ADDRESS}
            EOF
            chmod 600 /opt/apps/_gateway/.env

            # Emblem .env — hostname + image coordinates.
            cat > /opt/apps/emblem/.env <<EOF
            GH_REPO=${GH_REPO}
            IMAGE_TAG=${IMAGE_TAG}
            SITE_ADDRESS=${SITE_ADDRESS}
            EOF
            chmod 600 /opt/apps/emblem/.env

            # Gateway first so the shared network + TLS are live before apps.
            cd /opt/apps/_gateway
            docker compose pull
            docker compose up -d --remove-orphans

            cd /opt/apps/emblem
            docker compose pull
            docker compose up -d --remove-orphans

            docker image prune -f
