name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_repo: ${{ steps.repo.outputs.lc }}
      tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: repo
        run: echo "lc=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.lc }}/server:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.lc }}/server:latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build & push client
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/client/Dockerfile
          push: true
          build-args: |
            VITE_SERVER_URL=
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.lc }}/client:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.lc }}/client:latest
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            deploy

      - name: Copy compose + Caddyfile to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: "deploy/docker-compose.yml,deploy/Caddyfile"
          target: "/opt/emblem-cards"
          strip_components: 1

      - name: Pull & restart on droplet
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_REPO: ${{ needs.build-push.outputs.image_repo }}
          IMAGE_TAG: ${{ needs.build-push.outputs.tag }}
          SITE_ADDRESS: ${{ secrets.SITE_ADDRESS }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: GH_REPO,IMAGE_TAG,SITE_ADDRESS,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd /opt/emblem-cards
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cat > .env <<EOF
            GH_REPO=${GH_REPO}
            IMAGE_TAG=${IMAGE_TAG}
            SITE_ADDRESS=${SITE_ADDRESS}
            EOF
            chmod 600 .env
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            docker logout ghcr.io
