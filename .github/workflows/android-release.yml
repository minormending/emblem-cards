# Android release pipeline.
#
# Runs on:
#   - push to main that touches mobile sources, app.json, or this workflow
#   - manual workflow_dispatch (kicked off from chat via the Play MCP)
#
# What it does:
#   1. Decodes the keystore from a base64 secret + writes credentials.
#   2. Runs `expo prebuild` to regenerate android/ from app.json.
#   3. Runs setup-signing.sh to patch the signing block + drop x86 ABIs +
#      restore the JsonSlurper version read.
#   4. Builds a signed AAB.
#   5. Uploads to Play Store via the existing service-account credential
#      (same one the Play MCP uses for read tools).
#
# Required GitHub Secrets:
#   ANDROID_KEYSTORE_BASE64       - base64-encoded keystore file
#   ANDROID_KEYSTORE_PASSWORD     - keystore + key password
#   ANDROID_KEY_ALIAS             - keystore alias (e.g. "emblem-cards")
#   PLAY_SERVICE_ACCOUNT_JSON     - JSON of a Play Console service account
#                                   with "Manage production releases"
#                                   (or scoped to the target track only).
#
# Inputs (workflow_dispatch only):
#   track          - internal | alpha | beta | production. default: internal
#   user_fraction  - 0..1. default: 1.0 (100% of selected track)
#   release_notes  - optional. when blank, reads from
#                    packages/mobile/release/store-listing/release-notes-v<version>.txt
#                    (which is gitignored, so workflow_dispatch is the only
#                    way to ship custom notes from CI)
#
# Why internal as the default: production releases should be promoted via
# the Play Console UI or `mcp__emblem-play__update_rollout` after vitals
# are green. Pushing straight to production from CI is a footgun.

name: android-release

on:
  push:
    branches: [main]
    paths:
      - "packages/mobile/**"
      - "packages/shared/**"
      - "packages/card-engine/**"
      - "packages/battle-engine/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:
    inputs:
      track:
        description: "Play track to publish to"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      user_fraction:
        description: "Rollout fraction (0..1). Only used for production track."
        required: false
        default: "1.0"
      release_notes:
        description: "Release notes (en-US). When blank, reads from release/store-listing/release-notes-v<version>.txt"
        required: false
        default: ""

# Concurrency group prevents two simultaneous release runs from clobbering
# each other on the upload step. cancel-in-progress=false: if a build is
# already running, the new one queues — better than killing a build that's
# 8 minutes deep.
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Cache pnpm store for faster repeat runs.
      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # Build engine packages — same as scripts/build-release.sh does.
      - name: Build engines
        run: |
          pnpm --filter @cards/shared \
               --filter @cards/card-engine \
               --filter @cards/battle-engine \
               build

      # Read version from app.json so we tag downloaded artifacts and pick
      # the right release-notes file.
      - name: Read version
        id: version
        run: |
          v=$(node -e "console.log(require('./packages/mobile/app.json').expo.version)")
          c=$(node -e "console.log(require('./packages/mobile/app.json').expo.android.versionCode)")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "version_code=$c" >> "$GITHUB_OUTPUT"
          echo "Building Android v$v ($c)"

      # Decode keystore from secret. We write it to packages/mobile/release/
      # so setup-signing.sh's default path matches without modification.
      - name: Restore keystore + credentials
        working-directory: packages/mobile
        run: |
          mkdir -p release
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release/emblem-cards-release.keystore
          chmod 600 release/emblem-cards-release.keystore
          cat > release/keystore.credentials <<EOF
          EMBLEM_CARDS_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EMBLEM_CARDS_KEY_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EMBLEM_CARDS_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          EOF
          chmod 600 release/keystore.credentials

      # Regenerate android/ from app.json (since android/ is gitignored)
      # and patch in our signing config + ABI drop + JsonSlurper version
      # read via setup-signing.sh.
      - name: Regenerate android/ + apply signing
        working-directory: packages/mobile
        run: |
          npx expo prebuild --platform android --clean --no-install
          ./scripts/setup-signing.sh

      - name: Bundle JS
        working-directory: packages/mobile
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed \
            --platform android \
            --dev false \
            --entry-file index.ts \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Build AAB
        working-directory: packages/mobile/android
        run: ./gradlew bundleRelease --no-daemon

      - name: Stash AAB
        run: |
          src=packages/mobile/android/app/build/outputs/bundle/release/app-release.aab
          dst=packages/mobile/release/emblem-cards-game-v${{ steps.version.outputs.version }}-${{ steps.version.outputs.version_code }}.aab
          cp "$src" "$dst"
          ls -lh "$dst"
          echo "AAB_PATH=$dst" >> "$GITHUB_ENV"

      # Read release notes from the file if not supplied via workflow input.
      # The file is gitignored, so for push-driven runs we fall back to a
      # generic message — the user can re-run with workflow_dispatch + the
      # release_notes input to publish custom notes.
      - name: Resolve release notes
        id: notes
        run: |
          if [ -n "${{ github.event.inputs.release_notes }}" ]; then
            echo "${{ github.event.inputs.release_notes }}" > /tmp/notes.txt
          else
            f="packages/mobile/release/store-listing/release-notes-v${{ steps.version.outputs.version }}.txt"
            if [ -f "$f" ]; then
              cp "$f" /tmp/notes.txt
            else
              echo "Stability and performance improvements." > /tmp/notes.txt
            fi
          fi
          echo "Notes preview:"
          head -3 /tmp/notes.txt

      # The action wants whats-new files in en-US/ etc. Build that dir from
      # /tmp/notes.txt before the upload action runs.
      - name: Stage whats-new directory
        run: |
          mkdir -p /tmp/whatsnew
          cp /tmp/notes.txt /tmp/whatsnew/whatsnew-en-US

      # Upload the AAB to Play Console using the service-account JSON. The
      # action validates the AAB and creates a draft release; we set
      # status: completed (or inProgress for production rollouts <100%) so
      # it actually publishes. Mapping file makes obfuscated stack traces
      # in Play Console crash reports legible — pointed at gradle's output
      # path; existence check happens in the action itself.
      - name: Upload to Play Console
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.emblemcards.game
          releaseFiles: ${{ env.AAB_PATH }}
          track: ${{ github.event.inputs.track || 'internal' }}
          status: ${{ github.event.inputs.track == 'production' && github.event.inputs.user_fraction != '1.0' && 'inProgress' || 'completed' }}
          userFraction: ${{ github.event.inputs.track == 'production' && github.event.inputs.user_fraction || '' }}
          whatsNewDirectory: /tmp/whatsnew

      - name: Upload AAB as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: emblem-cards-aab-v${{ steps.version.outputs.version }}-${{ steps.version.outputs.version_code }}
          path: ${{ env.AAB_PATH }}
          retention-days: 30
