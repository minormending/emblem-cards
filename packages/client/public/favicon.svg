<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    Simplified for small sizes — browser tabs render at 16px or 32px, so
    decorative detail (stars, fine highlights) is dropped and silhouette
    + color carry the identity.
  -->
  <defs>
    <linearGradient id="shield" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9fafb"/>
      <stop offset="100%" stop-color="#6b7280"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#3f1705"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded square so the favicon reads on any browser tab -->
  <rect width="1024" height="1024" rx="180" fill="#0b0d12"/>

  <!-- Shield scaled to 85% so rounded corners don't clip it -->
  <g transform="translate(512 512) scale(0.85) translate(-512 -512)">
    <path
      d="M 224 208 L 800 208 L 800 520
         C 800 720 680 830 512 912
         C 344 830 224 720 224 520 Z"
      fill="url(#shield)" stroke="#3f1705" stroke-width="22" stroke-linejoin="round"/>

    <g transform="rotate(-35 512 548)">
      <polygon points="480,232 544,232 544,672 512,708 480,672"
               fill="url(#steel)" stroke="#0b0d12" stroke-width="12" stroke-linejoin="round"/>
      <rect x="416" y="668" width="192" height="30" rx="6"
            fill="#78350f" stroke="#0b0d12" stroke-width="10"/>
      <rect x="494" y="698" width="36" height="96"
            fill="url(#wood)" stroke="#0b0d12" stroke-width="10"/>
      <circle cx="512" cy="812" r="26" fill="#fbbf24" stroke="#0b0d12" stroke-width="10"/>
    </g>

    <g transform="rotate(35 512 548)">
      <rect x="494" y="240" width="36" height="560" rx="10"
            fill="url(#wood)" stroke="#0b0d12" stroke-width="10"/>
      <path d="M 530 276 L 700 240 L 736 340 L 700 440 L 530 404 Z"
            fill="url(#steel)" stroke="#0b0d12" stroke-width="12" stroke-linejoin="round"/>
      <circle cx="512" cy="810" r="22" fill="#92400e" stroke="#0b0d12" stroke-width="10"/>
    </g>

    <circle cx="512" cy="548" r="58" fill="#3f1705" stroke="#fbbf24" stroke-width="12"/>
    <polygon points="512,498 524,548 512,598 500,548" fill="#fbbf24"/>
    <polygon points="462,548 512,536 562,548 512,560" fill="#fbbf24"/>
  </g>
</svg>
